<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hamro AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e5e7eb;
    --text: #171717;
    --muted: #737373;
    --accent: #2563eb;
    --user: #2563eb;
    --code-inline-bg: #e5e7eb;
}

body.dark {
    --bg: #0b0d10;
    --panel: #111418;
    --border: #272c34;
    --text: #f5f5f5;
    --muted: #a1a1aa;
    --accent: #3b82f6;
    --user: #2563eb;
    --code-inline-bg: #272c34;
}

* {
    scrollbar-width: thin;
}

body {
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: var(--bg);
    color: var(--text);

    height: 100vh;
    overflow: hidden;
}

/* APP */

.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 260px;
    background: var(--panel);
    border-right: 1px solid var(--border);

    display: flex;
    flex-direction: column;

    flex-shrink: 0;
}

.sidebar-head {
    padding: 18px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
}

.brand-icon {
    width: 38px;
    height: 38px;

    background: var(--accent);
    color: white;

    border-radius: 11px;

    display: grid;
    place-items: center;

    font-size: 20px;
    font-weight: bold;
}

.brand-name {
    font-size: 18px;
    font-weight: 750;
}

.new-chat {
    width: 100%;
    height: 42px;

    border: 1px solid var(--border);
    border-radius: 9px;

    background: var(--panel);
    color: var(--text);

    cursor: pointer;

    font-size: 14px;
    font-weight: 600;
}

.new-chat:hover {
    background: var(--bg);
}

.history {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
}

.history-title {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;

    text-transform: uppercase;

    padding: 10px 8px;
}

.history-item {
    width: 100%;

    border: 0;
    background: transparent;

    color: var(--text);

    padding: 10px;

    border-radius: 8px;

    cursor: pointer;

    text-align: left;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
}

.history-item:hover {
    background: var(--bg);
}

.history-item.active {
    background: var(--bg);
    font-weight: 600;
}

.sidebar-bottom {
    border-top: 1px solid var(--border);
    padding: 12px;
}

.side-btn {
    width: 100%;

    border: 0;
    background: transparent;

    color: var(--text);

    padding: 10px;

    border-radius: 8px;

    cursor: pointer;

    text-align: left;
}

.side-btn:hover {
    background: var(--bg);
}

/* MAIN */

.main {
    flex: 1;
    min-width: 0;

    display: flex;
    flex-direction: column;
}

/* HEADER */

.header {
    height: 62px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    background: var(--panel);

    border-bottom: 1px solid var(--border);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.menu {
    display: none;

    border: 0;
    background: transparent;

    color: var(--text);

    font-size: 20px;
}

.title {
    font-size: 15px;
    font-weight: 700;
}

.badge {
    font-size: 10px;

    background: #dcfce7;
    color: #166534;

    padding: 4px 7px;

    border-radius: 20px;

    font-weight: 800;
}

body.dark .badge {
    background: #12351f;
    color: #86efac;
}

.header-actions {
    display: flex;
    gap: 4px;
}

.icon-btn {
    width: 36px;
    height: 36px;

    border: 0;
    background: transparent;

    color: var(--text);

    border-radius: 8px;

    cursor: pointer;

    font-size: 17px;
}

.icon-btn:hover {
    background: var(--bg);
}

/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
}

.chat-inner {
    width: min(850px, 100%);

    margin: auto;

    padding: 35px 20px 150px;
}

/* WELCOME */

.welcome {
    min-height: 65vh;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}

.welcome-icon {
    width: 70px;
    height: 70px;

    background: var(--accent);
    color: white;

    border-radius: 20px;

    display: grid;
    place-items: center;

    font-size: 32px;

    margin-bottom: 22px;
}

.welcome h1 {
    font-size: clamp(30px, 5vw, 43px);

    letter-spacing: -1.5px;

    margin-bottom: 12px;
}

.welcome p {
    color: var(--muted);

    max-width: 500px;

    line-height: 1.6;

    font-size: 14px;
}

.suggestions {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    width: min(650px, 100%);

    margin-top: 30px;
}

.suggestion {
    border: 1px solid var(--border);

    background: var(--panel);

    color: var(--text);

    border-radius: 12px;

    padding: 15px;

    text-align: left;

    cursor: pointer;
}

.suggestion:hover {
    border-color: var(--accent);
}

.suggestion strong {
    display: block;

    font-size: 13px;

    margin-bottom: 5px;
}

.suggestion span {
    color: var(--muted);

    font-size: 12px;
}

/* MESSAGE */

.message {
    display: flex;

    gap: 12px;

    margin-bottom: 25px;
}

.message.user {
    justify-content: flex-end;
}

.avatar {
    width: 34px;
    height: 34px;

    flex-shrink: 0;

    border-radius: 9px;

    background: var(--bg);

    display: grid;
    place-items: center;

    font-size: 13px;
    font-weight: 700;
}

.user .avatar {
    background: var(--user);
    color: white;
}

.message-body {
    max-width: 78%;
    min-width: 0;
}

.user .message-body {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
}

.bubble {
    font-size: 14px;
    line-height: 1.65;

    word-break: break-word;

    white-space: pre-wrap;
}

.bubble code {
    font-family: monospace;
    background: var(--code-inline-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
}

.bubble h1, .bubble h2, .bubble h3 {
    margin-top: 10px;
    margin-bottom: 6px;
}

.user .bubble {
    background: var(--user);
    color: white;

    padding: 11px 14px;

    border-radius: 16px 16px 4px 16px;
}

.actions {
    margin-top: 5px;
}

.action {
    border: 0;
    background: transparent;

    color: var(--muted);

    cursor: pointer;

    font-size: 11px;

    padding: 4px 6px;

    border-radius: 4px;
}

.action:hover {
    color: var(--text);
}

/* CODE */

.code {
    margin: 12px 0;

    border-radius: 9px;

    overflow: hidden;

    background: #0d1117;

    border: 1px solid #30363d;
}

.code-head {
    height: 35px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 10px;

    background: #161b22;

    color: #9ca3af;

    font-size: 11px;
}

.code-copy {
    border: 0;

    background: transparent;

    color: #c9d1d9;

    cursor: pointer;

    padding: 2px 6px;
    border-radius: 4px;
}

.code-copy:hover {
    background: rgba(255, 255, 255, 0.1);
}

.code pre {
    margin: 0;

    padding: 14px;

    overflow-x: auto;

    color: #e6edf3;

    font-size: 12px;

    line-height: 1.6;
}

.code pre code {
    background: transparent;
    padding: 0;
    color: inherit;
}

/* TYPING */

.typing {
    display: flex;
    gap: 5px;
}

.typing span {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--muted);

    animation: typing 1.1s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {
    0%, 60%, 100% {
        transform: translateY(0);
        opacity: .4;
    }

    30% {
        transform: translateY(-5px);
        opacity: 1;
    }
}

/* INPUT */

.input-area {
    position: fixed;

    bottom: 0;

    left: 260px;
    right: 0;

    padding: 12px 20px 17px;

    background:
        linear-gradient(
            transparent,
            var(--bg) 35%
        );
}

.input-box {
    width: min(850px, 100%);

    margin: auto;

    display: flex;
    align-items: flex-end;

    gap: 6px;

    padding: 7px;

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 15px;
}

textarea {
    flex: 1;

    min-height: 42px;
    max-height: 150px;

    resize: none;

    border: 0;
    outline: 0;

    background: transparent;

    color: var(--text);

    padding: 10px;

    font-family: inherit;

    font-size: 14px;
}

textarea::placeholder {
    color: var(--muted);
}

.send {
    width: 42px;
    height: 42px;

    border: 0;

    border-radius: 10px;

    background: var(--accent);

    color: white;

    font-size: 18px;

    cursor: pointer;
}

.send:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.info {
    text-align: center;

    color: var(--muted);

    font-size: 10px;

    margin-top: 6px;
}

/* MOBILE */

.overlay {
    display: none;
}

@media(max-width:750px) {

    .sidebar {
        position: fixed;

        left: 0;
        top: 0;

        height: 100vh;

        transform: translateX(-100%);

        transition: transform .2s;

        z-index: 100;
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .menu {
        display: block;

        cursor: pointer;
    }

    .overlay.show {
        display: block;

        position: fixed;

        inset: 0;

        background: rgba(0,0,0,.45);

        z-index: 90;
    }

    .input-area {
        left: 0;

        padding-left: 10px;
        padding-right: 10px;
    }

    .chat-inner {
        padding-left: 13px;
        padding-right: 13px;
    }

    .suggestions {
        grid-template-columns: 1fr;
    }

    .message-body {
        max-width: 83%;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

    <div class="sidebar-head">

        <div class="brand">

<section

<div

<script>

/* =========================================================
   API CONFIGURATION
========================================================= */

const API_URL =
    "https://hamro-ai-lilac.vercel.app/v1/chat/completions";

const API_KEY =
    "nishan-bajagain";

const MODEL =
    "random";


/*
   Generate a session ID to keep the randomly selected model pinned.
*/
function getSessionId() {
    let id = sessionStorage.getItem("hamro_ai_session");

    if (!id) {
        id = "web-" + Date.now() + "-" + Math.random().toString(36).substring(2, 12);
        sessionStorage.setItem("hamro_ai_session", id);
    }

    return id;
}

const SESSION_ID = getSessionId();


/* =========================================================
   CHAT DATABASE (data.json on the gateway)
   History is saved to the gateway's auth-protected /api/chats
   endpoint — the same data.json database as telemetry, not any
   online JSON-blob service. localStorage stays only as an
   offline cache.
========================================================= */

const CHATS_API_URL = API_URL.replace("/v1/chat/completions", "/api/chats");

function chatAuthHeaders() {
    return {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + API_KEY
    };
}

function ensureChatId(chat) {
    if (!chat.id) {
        chat.id = "chat_" + Date.now().toString(36) + "-" + Math.random().toString(36).substring(2, 8);
    }
    return chat.id;
}

async function loadChatsFromServer() {
    try {
        const res = await fetch(CHATS_API_URL + "?full=1", {
            headers: chatAuthHeaders(),
            cache: "no-store"
        });
        if (!res.ok) return null;
        const data = await res.json();
        return (Array.isArray(data.chats) && data.chats.length) ? data.chats : null;
    } catch (e) {
        return null;
    }
}

async function syncChatsToServer() {
    try {
        const res = await fetch(CHATS_API_URL, {
            method: "POST",
            headers: chatAuthHeaders(),
            body: JSON.stringify({
                chats: chats.map(function(c) {
                    return {
                        id: ensureChatId(c),
                        title: c.title,
                        messages: c.messages
                    };
                })
            })
        });
        if (!res.ok) console.warn("Chat sync to server failed (" + res.status + ")");
    } catch (e) {
        console.warn("Chat sync failed (offline?) — kept in localStorage.");
    }
}

async function deleteChatsOnServer() {
    try {
        await fetch(CHATS_API_URL, {
            method: "DELETE",
            headers: chatAuthHeaders()
        });
    } catch (e) {
        /* offline — local clear still applies */
    }
}


/* =========================================================
   STATE
========================================================= */

let messages = [
    {
        role: "system",
        content: "You are Hamro AI, a helpful and friendly AI assistant. Answer clearly and accurately."
    }
];

let chats = JSON.parse(localStorage.getItem("hamro_ai_chats") || "[]");
let currentChatIndex = null;


/* =========================================================
   ELEMENTS
========================================================= */

const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");
const chatInner = document.getElementById("chatInner");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const history = document.getElementById("history");


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {
    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================================================
   FORMAT RESPONSE (MARKDOWN & CODE BLOCKS)
========================================================= */

function formatResponse(text) {
    if (!text) return "";

    const codeBlocks = [];

    // Extract code blocks first to prevent inner markdown processing
    let formatted = text.replace(/```([\w+#.-]*)\n?([\s\S]*?)```/g, function(match, language, code) {
        const id = `___CODE_BLOCK_${codeBlocks.length}___`;
        codeBlocks.push({
            language: language.trim() || "code",
            code: code.trim()
        });
        return id;
    });

    // Escape HTML for text output safety
    formatted = escapeHTML(formatted);

    // Render markdown headings
    formatted = formatted.replace(/^### (.*$)/gim, '<h3>$1</h3>');
    formatted = formatted.replace(/^## (.*$)/gim, '<h2>$1</h2>');
    formatted = formatted.replace(/^# (.*$)/gim, '<h1>$1</h1>');

    // Render bold, italic & inline code
    formatted = formatted.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
    formatted = formatted.replace(/\*(.*?)\*/g, "<em>$1</em>");
    formatted = formatted.replace(/`([^`]+)`/g, "<code>$1</code>");

    // Reinsert code blocks
    codeBlocks.forEach((block, index) => {
        const id = `___CODE_BLOCK_${index}___`;
        const escapedCode = escapeHTML(block.code);

        const codeHtml = `
            <div class="code">
                <div class="code-head">
                    <span>${escapeHTML(block.language)}</span>
                    <button class="code-copy" onclick="copyCodeBlock(this)">Copy</button>
                </div>
                <pre><code>${escapedCode}</code></pre>
            </div>
        `;

        formatted = formatted.replace(id, codeHtml);
    });

    return formatted;
}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(role, text) {
    const welcome = document.getElementById("welcome");
    if (welcome) {
        welcome.remove();
    }

    const message = document.createElement("div");
    message.className = "message " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "U" : "✦";

    const body = document.createElement("div");
    body.className = "message-body";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (role === "assistant") {
        bubble.innerHTML = formatResponse(text);
    } else {
        bubble.textContent = text;
    }

    const actions = document.createElement("div");
    actions.className = "actions";

    const copy = document.createElement("button");
    copy.className = "action";
    copy.textContent = "Copy";
    copy.onclick = () => copyText(text, copy);

    actions.appendChild(copy);

    body.appendChild(bubble);
    body.appendChild(actions);

    message.appendChild(avatar);
    message.appendChild(body);

    chatInner.appendChild(message);

    scrollBottom();
}


/* =========================================================
   TYPING
========================================================= */

function showTyping() {
    const element = document.createElement("div");
    element.id = "typing";
    element.className = "message assistant";

    element.innerHTML = `
        <div class="avatar">✦</div>
        <div class="message-body">
            <div class="bubble">
                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    `;

    chatInner.appendChild(element);
    scrollBottom();
}

function hideTyping() {
    const element = document.getElementById("typing");
    if (element) {
        element.remove();
    }
}


/* =========================================================
   SEND
========================================================= */

async function sendMessage() {
    if (send.disabled) return;

    const text = input.value.trim();
    if (!text) return;

    send.disabled = true;
    input.value = "";
    resizeInput();

    addMessage("user", text);
    messages.push({
        role: "user",
        content: text
    });

    showTyping();

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + API_KEY,
                "x-session-id": SESSION_ID
            },
            body: JSON.stringify({
                model: MODEL,
                messages: messages,
                stream: false
            })
        });

        const raw = await response.text();
        let data;

        try {
            data = JSON.parse(raw);
        } catch {
            data = { raw: raw };
        }

        hideTyping();

        if (!response.ok) {
            let message =
                data?.error?.message ||
                data?.error ||
                data?.message ||
                data?.raw ||
                "Unknown API error";

            throw new Error("API " + response.status + ": " + message);
        }

        const reply = data?.choices?.[0]?.message?.content;

        if (!reply) {
            console.error("Full API response:", data);
            throw new Error("API connected, but no AI response was returned.");
        }

        addMessage("assistant", reply);
        messages.push({
            role: "assistant",
            content: reply
        });

        saveChat();

        console.log(
            "Hamro AI model:",
            response.headers.get("x-gateway-model") ||
            response.headers.get("x-gateway-session-model")
        );

    } catch (error) {
        hideTyping();
        console.error("Hamro AI request failed:", error);

        let message = error.message === "Failed to fetch"
            ? "The browser could not connect to the Hamro AI API. Please check your internet connection or verify CORS access."
            : error.message;

        addMessage("assistant", "❌ " + message);
    } finally {
        send.disabled = false;
        input.focus();
    }
}


/* =========================================================
   SUGGESTION
========================================================= */

function ask(text) {
    input.value = text;
    resizeInput();
    sendMessage();
}


/* =========================================================
   NEW CHAT
========================================================= */

function newChat() {
    messages = [
        {
            role: "system",
            content: "You are Hamro AI, a helpful and friendly AI assistant. Answer clearly and accurately."
        }
    ];

    currentChatIndex = null;

    chatInner.innerHTML = `
        <div class="welcome" id="welcome">
            <div class="welcome-icon">✦</div>
            <h1>How can I help?</h1>
            <p>
                Free AI chat powered by Hamro AI.
                The gateway automatically selects a free model.
            </p>

            <div class="suggestions">
                <button class="suggestion" onclick="ask('Explain artificial intelligence in simple words')">
                    <strong>Explain something</strong>
                    <span>Make difficult topics easy</span>
                </button>

                <button class="suggestion" onclick="ask('Write a simple HTML website for me')">
                    <strong>Write code</strong>
                    <span>Create a website or program</span>
                </button>

                <button class="suggestion" onclick="ask('Give me 5 useful study tips')">
                    <strong>Study help</strong>
                    <span>Get useful study advice</span>
                </button>

                <button class="suggestion" onclick="ask('Tell me an interesting fact')">
                    <strong>Ask anything</strong>
                    <span>Discover something interesting</span>
                </button>
            </div>
        </div>
    `;

    renderHistory();
    closeSidebar();
}


/* =========================================================
   SAVE CHAT
========================================================= */

function saveChat() {
    const userMessages = messages.filter(x => x.role === "user");
    if (userMessages.length === 0) return;

    const title = userMessages[0].content.substring(0, 45);

    if (currentChatIndex === null) {
        chats.push({
            id: "chat_" + Date.now().toString(36) + "-" + Math.random().toString(36).substring(2, 8),
            title: title,
            messages: JSON.parse(JSON.stringify(messages))
        });
        currentChatIndex = chats.length - 1;
    } else {
        chats[currentChatIndex] = {
            id: ensureChatId(chats[currentChatIndex]),
            title: chats[currentChatIndex].title || title,
            messages: JSON.parse(JSON.stringify(messages))
        };
    }

    chats = chats.slice(-30);
    localStorage.setItem("hamro_ai_chats", JSON.stringify(chats));
    syncChatsToServer();

    renderHistory();
}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory() {
    history.innerHTML = "";

    chats.slice().reverse().forEach((item, reverseIndex) => {
        const index = chats.length - 1 - reverseIndex;

        const button = document.createElement("button");
        button.className = "history-item" + (index === currentChatIndex ? " active" : "");
        button.textContent = item.title;

        button.onclick = function() {
            loadChat(index);
        };

        history.appendChild(button);
    });
}


function loadChat(index) {
    const saved = chats[index];
    if (!saved) return;

    currentChatIndex = index;
    messages = JSON.parse(JSON.stringify(saved.messages));

    chatInner.innerHTML = "";

    messages
        .filter(x => x.role !== "system")
        .forEach(x => addMessage(x.role, x.content));

    renderHistory();
    closeSidebar();
}


function clearHistory() {
    if (!confirm("Delete all chat history?")) return;

    chats = [];
    currentChatIndex = null;

    localStorage.removeItem("hamro_ai_chats");
    deleteChatsOnServer();

    renderHistory();
    newChat();
}


/* =========================================================
   COPY FUNCTIONS
========================================================= */

async function copyText(text, buttonElement) {
    try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
        } else {
            const area = document.createElement("textarea");
            area.value = text;
            document.body.appendChild(area);
            area.select();
            document.execCommand("copy");
            area.remove();
        }

        if (buttonElement) {
            const origText = buttonElement.textContent;
            buttonElement.textContent = "Copied!";
            setTimeout(() => {
                buttonElement.textContent = origText;
            }, 1200);
        }
    } catch (err) {
        console.error("Failed to copy text: ", err);
    }
}


function copyCodeBlock(button) {
    const codeElement = button.closest('.code')?.querySelector('pre code');
    if (codeElement) {
        copyText(codeElement.innerText, button);
    }
}


/* =========================================================
   THEME
========================================================= */

function toggleTheme() {
    document.body.classList.toggle("dark");

    localStorage.setItem(
        "hamro_theme",
        document.body.classList.contains("dark") ? "dark" : "light"
    );
}

if (localStorage.getItem("hamro_theme") === "dark") {
    document.body.classList.add("dark");
}


/* =========================================================
   INPUT
========================================================= */

function resizeInput() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 150) + "px";
}

input.addEventListener("input", resizeInput);

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});


/* =========================================================
   MOBILE & KEYBOARD ACCESSIBILITY
========================================================= */

function openSidebar() {
    sidebar.classList.add("open");
    overlay.classList.add("show");
}

function closeSidebar() {
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
}

window.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
        closeSidebar();
    }
});


/* =========================================================
   SCROLL
========================================================= */

function scrollBottom() {
    requestAnimationFrame(() => {
        chat.scrollTop = chat.scrollHeight;
    });
}


/* =========================================================
   INIT
========================================================= */

(async function initChats() {
    const serverChats = await loadChatsFromServer();
    if (serverChats) {
        chats = serverChats;
    } else {
        // Offline / first run: use the local cache and push it up when reachable.
        chats.forEach(ensureChatId);
        if (chats.length) syncChatsToServer();
    }
    renderHistory();
})();

input.focus();

</script>
